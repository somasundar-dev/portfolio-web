name: Profolio CI Checks

on:
  push:
    paths:
      - 'apps/portfolio/**'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'apps/portfolio/**'
    branches:
      - main

jobs:
    build-portfolio:
        uses: somasundar-dev/devops-toolkit/.github/workflows/angular-ci.yaml@main
        with:
            node_version: '19'

    